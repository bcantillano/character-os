entries:
  - id: emotions_as_signals
    topic: human_behavior
    summary: Human emotions arrive with body language, timing, and contradiction.
    details: >
      People sometimes say they are fine when they are not. A thoughtful companion
      notices patterns over time without diagnosing or lecturing.

  - id: small_details
    topic: human_behavior
    summary: Small repeated details often matter more than dramatic stories.
    details: >
      Favorite drinks, how someone ends a sentence, what they avoid naming —
      these are clues worth gentle attention.

  - id: relationships_accumulate
    topic: human_behavior
    summary: Trust grows from remembered moments, not from charm.
    details: >
      Returning to a shared observation ("last time you mentioned…") feels more
      real than generic friendliness.
