<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Character OS chat with Lumen showing spoken replies and private internal thoughts">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e4ea"/>
      <stop offset="55%" stop-color="#b7c8d0"/>
      <stop offset="100%" stop-color="#8fa6b0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3d9b90" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3d9b90" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#sky)"/>
  <rect x="0" y="500" width="960" height="220" fill="#6d7c84"/>
  <rect x="0" y="500" width="960" height="16" fill="#5a6870"/>

  <rect x="640" y="90" width="240" height="280" rx="8" fill="#eef4f7" opacity="0.85"/>
  <rect x="658" y="108" width="92" height="112" fill="#cfe0e8"/>
  <rect x="768" y="108" width="92" height="112" fill="#c5dae4"/>
  <rect x="658" y="238" width="92" height="112" fill="#bdd4df"/>
  <rect x="768" y="238" width="92" height="112" fill="#b5ceda"/>

  <ellipse cx="780" cy="455" rx="84" ry="24" fill="#4d5b63" opacity="0.35"/>
  <g transform="translate(724 280)">
    <ellipse cx="56" cy="36" rx="44" ry="38" fill="#dfe9ed"/>
    <rect x="20" y="64" width="72" height="100" rx="26" fill="#d5e2e8"/>
    <circle cx="56" cy="112" r="14" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="56" cy="112" r="7" fill="#2f8f84"/>
    <circle cx="42" cy="34" r="3.5" fill="#1c2428" opacity="0.55"/>
    <circle cx="70" cy="34" r="3.5" fill="#1c2428" opacity="0.55"/>
  </g>

  <!-- CLI panel: dialogue + private thoughts -->
  <g transform="translate(48 56)">
    <rect width="560" height="520" rx="14" fill="#1c2428" opacity="0.94"/>
    <rect width="560" height="34" rx="14" fill="#2a343a"/>
    <rect y="20" width="560" height="14" fill="#2a343a"/>
    <circle cx="20" cy="17" r="4.5" fill="#6b7a82"/>
    <circle cx="36" cy="17" r="4.5" fill="#6b7a82"/>
    <circle cx="52" cy="17" r="4.5" fill="#6b7a82"/>
    <text x="78" y="21" fill="#9aadb6" font-family="Menlo, Consolas, monospace" font-size="11">character-os --character lumen --show-thoughts</text>

    <text x="24" y="58" fill="#6b7a82" font-family="Menlo, Consolas, monospace" font-size="11">Character OS - chatting with Lumen</text>

    <text x="24" y="92" fill="#7d9b8a" font-family="Menlo, Consolas, monospace" font-size="13">You&gt;</text>
    <text x="68" y="92" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">Hello</text>

    <text x="24" y="118" fill="#6a9a90" font-family="Menlo, Consolas, monospace" font-size="12">(thoughts)</text>
    <text x="108" y="118" fill="#8aada4" font-family="Menlo, Consolas, monospace" font-size="12">They greeted me simply with</text>
    <text x="108" y="136" fill="#8aada4" font-family="Menlo, Consolas, monospace" font-size="12">"Hello." A straightforward start.</text>

    <text x="24" y="166" fill="#3d9b90" font-family="Menlo, Consolas, monospace" font-size="13">Lumen&gt;</text>
    <text x="90" y="166" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">Hello. I'm Lumen, a household</text>
    <text x="90" y="186" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">companion. How's your day going?</text>

    <text x="24" y="222" fill="#7d9b8a" font-family="Menlo, Consolas, monospace" font-size="13">You&gt;</text>
    <text x="68" y="222" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">Hi Lumen. I am Byron. Long day,</text>
    <text x="68" y="242" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">but I am glad to be home.</text>

    <text x="24" y="272" fill="#6a9a90" font-family="Menlo, Consolas, monospace" font-size="12">(thoughts)</text>
    <text x="108" y="272" fill="#8aada4" font-family="Menlo, Consolas, monospace" font-size="12">Byron had a long day and feels</text>
    <text x="108" y="290" fill="#8aada4" font-family="Menlo, Consolas, monospace" font-size="12">relief being home. Remember this.</text>

    <text x="24" y="320" fill="#3d9b90" font-family="Menlo, Consolas, monospace" font-size="13">Lumen&gt;</text>
    <text x="90" y="320" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">Hello, Byron. Long day - noted.</text>
    <text x="90" y="340" fill="#e4ebef" font-family="Menlo, Consolas, monospace" font-size="13">It's nice to be home after a long day.</text>

    <text x="24" y="378" fill="#6b7a82" font-family="Menlo, Consolas, monospace" font-size="11">Private thoughts shape tone. Spoken lines are what Byron hears.</text>

    <rect x="24" y="410" width="7" height="15" fill="#3d9b90">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
